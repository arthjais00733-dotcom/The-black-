<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GHOST PROTOCOL — Vocabulary</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud-header">
    <span class="logo">◈ GHOST PROTOCOL</span>
    <div class="stat-bar">
      <span class="stat-item">MASTERED <span class="stat-val" id="mastered-count">0</span></span>
      <span class="divider">|</span>
      <span class="stat-item">TOTAL <span class="stat-val" id="total-count">0</span></span>
    </div>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

  <div class="hud-card" id="main-ui" style="padding: 20px; text-align: center; border: 1px solid #ffcc00;">
    <h3 style='color: yellow; font-family: "Share Tech Mono", monospace;'>System Booting...</h3>
  </div>

  <script>
    // 1. Global Error Catcher (Code ki koi bhi galti ab chhup nahi payegi)
    window.onerror = function(message, source, lineno, colno, error) {
      document.getElementById('main-ui').innerHTML = `<h3 style='color: red; font-family: "Share Tech Mono", monospace;'>CODE CRASH: ${message} <br> (Line: ${lineno})</h3>`;
      return true;
    };

    let wordData = [];
    let mastery = [];

    async function initApp() {
      const mainUi = document.getElementById('main-ui');
      mainUi.innerHTML = "<h3 style='color: yellow; font-family: \"Share Tech Mono\", monospace;'>Initializing System...</h3>";

      try {
        // 2. Checking agar network block ki wajah se library load nahi hui
        if (typeof supabase === 'undefined') {
          throw new Error("Supabase Library Load Nahi Hui (CDN blocked or network drop)");
        }

        const supabaseUrl = 'https://hbdcavwjbnkyghupsaxo.supabase.co';
        const supabaseKey = 'sb_publishable_ozN1P49y3sCErxjH6Ek02Q_cE-ptWDQ';
        const sbClient = supabase.createClient(supabaseUrl, supabaseKey);

        mainUi.innerHTML = "<h3 style='color: yellow; font-family: \"Share Tech Mono\", monospace;'>Fetching Data...</h3>";

        const { data, error } = await sbClient.from('words').select('*');
        
        if (error) {
          mainUi.innerHTML = `<h3 style='color: red; font-family: "Share Tech Mono", monospace;'>DB ERROR: <br> ${error.message}</h3>`;
        } else {
          wordData = data || [];
          mainUi.innerHTML = `<h3 style='color: #0f0; font-family: "Share Tech Mono", monospace;'>UPLINK SUCCESS!<br>${wordData.length} Words Loaded.</h3>`;
          mastery = JSON.parse(localStorage.getItem('myMasteryList')) || [];
          updateStats();
        }
      } catch (err) {
        mainUi.innerHTML = `<h3 style='color: red; font-family: "Share Tech Mono", monospace;'>CRITICAL ERROR: <br> ${err.message}</h3>`;
      }
    }

    function updateStats() {
      const total = wordData.length;
      document.getElementById('mastered-count').textContent = mastery.length;
      document.getElementById('total-count').textContent = total;
      const pct = total > 0 ? (mastery.length / total) * 100 : 0;
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    // 0.5 second ka delay taaki page aur external scripts aaram se saans le sakein
    setTimeout(initApp, 500);
  </script>
</body>
</html>
